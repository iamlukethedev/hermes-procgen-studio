# DRAFT catalog entry for NousResearch/hermes-agent: plugin-catalog/procgen-studio.yaml
#
# Not submitted. Before opening the catalog PR:
#   1. Make github.com/iamlukethedev/hermes-procgen-studio public (the catalog requires a public repo).
#   2. Merge the release into main, then replace SHA_PLACEHOLDER below with that commit's full
